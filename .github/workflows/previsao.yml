name: Gerar previsao de arrecadacao

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Coluna alvo (ex: "Tipo Judiciais")'
        required: true
        type: string
      variaveis:
        description: 'Variaveis exogenas separadas por virgula (vazio = nenhuma)'
        required: false
        type: string
        default: ''
      meses_teste:
        description: 'Meses de backtest'
        required: false
        type: string
        default: '6'
      base_path:
        description: 'Caminho da base dentro do repositorio'
        required: true
        type: string
        default: 'dados/BASE_MONTADA_LIMPA_-_atualizac_a_o.xlsx'
      execucao_id:
        description: 'id da linha em previsao_execucoes a atualizar (enviado pela Edge Function)'
        required: false
        type: string
        default: ''

env:
  # URL publica do projeto (nao e segredo - e a mesma que fica em VITE_SUPABASE_URL no .env do app)
  PREVISAO_CALLBACK_URL: https://qrvyjpgypceakznddmxf.supabase.co/functions/v1/previsao-callback

jobs:
  previsao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Marcar execucao como "executando"
        if: inputs.execucao_id != ''
        run: |
          curl -sS -X POST "$PREVISAO_CALLBACK_URL" \
            -H "x-previsao-secret: ${{ secrets.PREVISAO_CALLBACK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"execucao_id\":\"${{ inputs.execucao_id }}\",\"status\":\"executando\",\"github_run_id\":\"${{ github.run_id }}\"}"

      - name: Rodar previsao
        id: previsao
        run: |
          python scripts/forecast.py \
            --alvo "${{ inputs.alvo }}" \
            --variaveis "${{ inputs.variaveis }}" \
            --meses-teste "${{ inputs.meses_teste }}" \
            --base-path "${{ inputs.base_path }}" \
            --saida previsao.json

      - name: Gravar resultado (via previsao-callback)
        if: success() && inputs.execucao_id != ''
        run: |
          python - <<'PYEOF'
          import json, os, urllib.request

          with open("previsao.json") as f:
              resultado = json.load(f)

          payload = json.dumps({
              "execucao_id": os.environ["EXECUCAO_ID"],
              "status": "concluido",
              "mape": resultado["mape"],
              "previsao": resultado["previsao"],
              "real_periodo_teste": resultado["real_periodo_teste"],
          }).encode()

          req = urllib.request.Request(os.environ["PREVISAO_CALLBACK_URL"], data=payload, method="POST", headers={
              "x-previsao-secret": os.environ["PREVISAO_CALLBACK_SECRET"],
              "Content-Type": "application/json",
          })
          urllib.request.urlopen(req)
          PYEOF
        env:
          PREVISAO_CALLBACK_SECRET: ${{ secrets.PREVISAO_CALLBACK_SECRET }}
          EXECUCAO_ID: ${{ inputs.execucao_id }}

      - name: Marcar execucao como "erro" (se algo falhou acima)
        if: failure() && inputs.execucao_id != ''
        run: |
          curl -sS -X POST "$PREVISAO_CALLBACK_URL" \
            -H "x-previsao-secret: ${{ secrets.PREVISAO_CALLBACK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"execucao_id\":\"${{ inputs.execucao_id }}\",\"status\":\"erro\",\"erro\":\"Job do GitHub Actions falhou - ver run ${{ github.run_id }}\"}"

      - name: Publicar resultado como artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: previsao
          path: previsao.json
